svin_rerun_bridge:
  ros__parameters:
    application_id: svin_rerun
    enable_live: true
    enable_recording: false
    rrd_path: ""
    viewer_url: rerun+http://127.0.0.1:9876/proxy
    jpeg_quality: 75
    # Optional OKVIS camera calibration. When provided, static double-sphere
    # meshes are logged below world/cameras/camN and keyframe images update
    # their albedo textures in place.
    okvis_config: ""
    enable_double_sphere_mesh: true
    # Moving root for world/rig and calibrated camera child transforms:
    # pose_graph (default), odometry, or keyframe.
    mesh_pose_source: pose_graph
    # Mesh geometry is independent from texture updates. When the master mesh
    # switch is false, no geometry or image texture is decoded/logged.
    enable_mesh_texture_updates: true
    mesh_texture_stride: 10
    double_sphere_depth: 0.35
    double_sphere_grid: 31
    texture_max_width: 128 
    # Global landmark visibility radius, expressed in Rerun UI points.
    point_radius_ui_points: 1.5
    # Explicit raw CompressedImage topics. Empty disables raw payload logging.
    raw_compressed_image_topics:
      - /insta360/front/image_raw/compressed
      - /insta360/rear/image_raw/compressed
    raw_sync_pending_capacity: 32

    points_matched_topic: /okvis_points_matched
    global_map_topic: /global_map
    okvis_path_topic: /okvis_path
    loop_closure_path_topic: /loop_closure_path
    # Topic used only when mesh_pose_source is odometry.
    odometry_topic: /okvis_odometry
    keyframe_pose_topic: /keyframe_pose
    keyframe_pose_required: true
    # OKVIS keyframe publishers use reliable QoS. A deeper reliable queue
    # prevents the single-threaded bridge from losing one camera while Rerun
    # serialization is in progress.
    keyframe_subscription_depth: 32
    # An explicit non-empty keyframe_image_topics list would take precedence
    # over count/pattern. Omit it here to use the node's typed empty-list
    # default; ROS 2 parameter files cannot infer the type of a literal [].
    keyframe_image_count: 2
    keyframe_image_topic_pattern: /keyframe_image_{index}
    # Maximum number of incomplete timestamp bundles retained while cameras
    # arrive asynchronously. The oldest bundle is dropped when this is full.
    keyframe_sync_pending_capacity: 32

    enable_visualization_markers: true
    visualization_topic: /visualization
